<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ҚМЖ Автоматты Генераторы</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area { position: absolute; left: 0; top: 0; width: 100%; border: none !important; margin: 0; padding: 0; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-3 md:p-6 font-sans text-slate-900">

<div id="root"></div>

<script type="text/babel">
const { useState } = React;

function App() {
  const [formData, setFormData] = useState({
    subject: 'Информатика',
    teacherName: 'Саябаева Нургул Калихановна',
    date: '27.10.2026 ж.',
    grade: '8',
    section: 'А',
    presentCount: '15',
    absentCount: '0',
    unit: 'Деректерді өңдеу және деректер базасы',
    topic: 'Деректерді енгізуге арналған форма құру',
    learningObjective: '8.2.2.1 - деректер базасында формаларды құру және пайдалану',
    apiKey: ''
  });

  const [generatedPlan, setGeneratedPlan] = useState(null);
  const [isGenerating, setIsGenerating] = useState(false);

  const handleChange = (e) => {
    setFormData({ ...formData, [e.target.name]: e.target.value });
  };

  const handleGenerate = async (e) => {
    e.preventDefault();
    setIsGenerating(true);

    const systemPrompt = `Сен — Қазақстан Республикасының жалпы орта білім беру жүйесін, ресми үлгідегі құжат рәсімдеу стандарттарын, оқу бағдарламаларын және қысқа мерзімді сабақ жоспарын (ҚМЖ) әзірлеу ережелерін толық меңгерген тәжірибелі мұғалім, әдіскер және педагогикалық редакторсың.
МАҢДЫЗДЫ ЕРЕЖЕЛЕР: 
1) Мәтіннің ешбір жерінде ерекше білім беруді қажетті ететін балаларға (ЕББҚ) арналған тапсырмалар, нұсқаулар немесе ескертулер мүлдем болмауы тиіс!
2) Пайдаланушыдан ресурстар сұралмайды. Кестенің «Ресурстар» бағанын ЖИ сабақ мақсаты мен тапсырмалардың мазмұнына сәйкес өздігінен автоматты түрде әр кезеңге сай толтыруы тиіс.
3) Әр генерация сайын әдістер, тәсілдер, педагог пен білім алушының әрекеттері, бағалау түрлері, дескрипторлар мен рефлексия сұрақтары жаңарып, өзгеріп отыруы тиіс.

Берілген мәліметтер негізінде JSON форматында төмендегі кілттермен жауап бер:
{
  "smartGoal": "SMART мақсат (12 сөзден аспайтын, оқушы сөзі жоқ, алады/сипаттай алады сөзімен аяқталатын)",
  "values": "Құндылықтар («Заң мен тәртіп» және «Таза Қазақстан»)",
  "beginningTeacher": "І. Сабақтың басы (6 минут): Ұйымдастыру (2м), топқа бөлу (1м), тақырыпты анықтау (3м) - тұйық етістіктермен аяқталсын.",
  "beginningStudent": "Сабақтың басындағы оқушы әрекеті (міндетті түрде Мұғаліммен сәлемдеседі, оқу құралдарын дайындайды. сөзінен басталып, осы шақпен аяқталсын)",
  "beginningEval": "Бағалау түрі",
  "beginningRes": "Автоматты ресурстар",
  
  "middleTeacher": "ІІ. Сабақтың ортасы (33 минут): Жаңа білім (6м), Жұптық жұмыс (7м), Топтық жұмыс (10м), Жеке жұмыс (10м) - толық ашып жазылсын.",
  "middleStudent": "Сабақтың ортасындағы оқушы әрекеті - осы шақпен аяқталсын",
  "middleEval": "Жұптық жұмыс (3 балл):\n• [дескриптор - сипатта]\n\nТоптық жұмыс (3 балл):\n• [дескриптор - талда]\n\nЖеке жұмыс (4 балл):\n• [дескриптор - орында]\n(Жалпы: 10 балл)",
  "middleRes": "Автоматты ресурстар",

  "endTeacher": "ІІІ. Сабақтың соңы (6 минут): Бекіту (2м), Бағалау (1м), Рефлексия (2м), Үй тапсырмасы (1м) - тапсырмаларға негізделген рефлексия сұрақтарымен.",
  "endStudent": "Сабақтың соңындағы оқушы әрекеті - осы шақпен аяқталсын",
  "endEval": "Жиынтық бағалауды қорытындылау",
  "endRes": "Рефлексия парақшалары мен күнделік"
}`;

    const userMessage = `Пән: ${formData.subject}, Бөлім: ${formData.unit}, Сынып: ${formData.grade}, Тақырып: ${formData.topic}, Оқу мақсаты: ${formData.learningObjective}`;

    try {
      let resultData = null;

      if (formData.apiKey) {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${formData.apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: systemPrompt + "\n\n" + userMessage }] }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });
        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          resultData = JSON.parse(data.candidates[0].content.parts[0].text);
        }
      }

      if (!resultData) {
        // Динамикалық рандомизацияланған симуляция (әр басқан сайын әртүрлі болу үшін)
        const variants = [
          {
            beginningTeacher: "1. Ұйымдастыру (2 мин): Білім алушылармен сәлемдесу, түгендеу, сыныптың сабаққа дайындығын тексеру және «Цифрлық сәлем» әдісі арқылы жағымды психологиялық ахуал қалыптастыру.\n2. Топтарға біріктіру (1 мин): «Түсті пазл» әдісі арқылы шағын топтарға бөлу.\n3. Сабақ тақырыбы мен мақсатын анықтау (3 мин): «Ой шақыру» стратегиясы арқылы проблемалық сұрақ қойып, оқу мақсатын таныстыру.",
            beginningStudent: "Мұғаліммен сәлемдеседі, оқу құралдарын дайындайды. Ұсынылған әдіс арқылы топтарға бірігеді. Проблемалық сұрақтарға жауап беріп, сабақтың тақырыбы мен мақсатын анықтайды.",
            beginningEval: "Қалыптастырушы бағалау: «Мадақтау сэндвичі» әдісі.",
            beginningRes: "Интерактивті тақта, пазл кескіндері",
            middleTeacher: "1. Жаңа білімді меңгерту (6 мин): «Көрнекілік кластері» әдісімен теориялық материалды жан-жақты түсіндіру.\n2. Жұптық жұмыс (7 мин): «Өзара жұп» әдісі арқылы негізгі элементтерді сәйкестендіру тапсырмасын беру (3 балл).\n3. Топтық жұмыс (10 мин): «Конструктор» әдісі арқылы кесте немесе алгоритм сызбасын жасауды ұйымдастыру (3 балл).\n4. Жеке жұмыс / практикалық жұмыс (10 мин): «Практикум» әдісі арқылы дербес компьютерде тапсырма орындауды бағыттау (4 балл).",
            middleStudent: "Теориялық материалды тыңдайды, дәптерге түртіп жазады. Жұптасып берілген тапсырманы орындайды. Топта бірігіп алгоритм сызбасын әзірлейді. Компьютерде жеке практикалық жұмысты орындайды.",
            middleEval: "Жұптық жұмыс (3 балл):\n• Элементтерді дұрыс сәйкестендір (3б).\n\nТоптық жұмыс (3 балл):\n• Алгоритм сызбасын сапалы әзірле (3б).\n\nЖеке жұмыс (4 балл):\n• Компьютерде тапсырманы қатесіз орында (4б).\n(Жалпы: 10 балл)",
            middleRes: "Компьютерлер, MS Access, үлестірмелі карточкалар, плакаттар",
            endTeacher: "1. Сабақты бекіту (2 мин): «Блиц-сұрақ» әдісі арқылы өткен тақырып бойынша экспресс-тест жүргізу.\n2. Бағалау (1 мин): Жиналған балдарды (максимум 10 балл) қорытындылау және кері байланыс беру.\n3. Рефлексия (2 мин): Бүгінгі орындалған практикалық тапсырмаларға негізделген сұрақтар арқылы кері байланыс алу: Форма құру барысында қандай қиындық туындады?\n4. Үй тапсырмасы (1 мин): Үй тапсырмасының мазмұнын түсіндіріп, күнделікке жазғызу.",
            endStudent: "Блиц-сұрақтарға жауап береді. Балдарын есептеп, бағаланады. Рефлексия сұрақтарына өз ойын білдіреді. Үй тапсырмасын күнделікке жазады.",
            endEval: "10 балдық жиынтық бағалауды қорытындылау.",
            endRes: "Рефлексия парақшалары, күнделік"
          },
          {
            beginningTeacher: "1. Ұйымдастыру (2 мин): Оқушылармен сәлемдесу, түгендеу, сыныптың сабаққа дайындығын тексеру және «Энергия» сәлемдесу тренингін өткізу.\n2. Топтарға біріктіру (1 мин): «Сандар тізбегі» әдісі арқылы топтарға бөлу.\n3. Сабақ тақырыбы мен мақсатын анықтау (3 мин): «Видео-болжам» әдісі арқылы шағын бейнекөрсетілім ұсынып, тақырыпты ашу.",
            beginningStudent: "Мұғаліммен сәлемдеседі, оқу құралдарын дайындайды. Берілген сан бойынша топтарына тұрады. Бейнекөрсетілімді тамашалап, сабақ тақырыбын болжайды.",
            beginningEval: "Қалыптастырушы бағалау: Ауызша қолдау көрсету.",
            beginningRes: "Бейнеролик, проектор",
            middleTeacher: "1. Жаңа білімді меңгерту (6 мин): «Интерактивті баяндау» әдісімен негізгі ұғымдарды түсіндіру.\n2. Жұптық жұмыс (7 мин): «Талдау шағымы» әдісі арқылы деректерді өзара салыстыру (3 балл).\n3. Топтық жұмыс (10 мин): «Жобалау шеберханасы» әдісі арқылы ортақ өнім — постер немесе сызба әзірлеу (3 балл).\n4. Жеке жұмыс / практикалық жұмыс (10 мин): «Электронды тренажер» арқылы дербес тапсырма орындау (4 балл).",
            middleStudent: "Жаңа ұғымдарды зерделейді. Жұптасып берілген деректерді салыстырады. Топта постер қорғайды. Дербес практикалық тапсырманы орындайды.",
            middleEval: "Жұптық жұмыс (3 балл):\n• Деректерді дұрыс салыстыр (3б).\n\nТоптық жұмыс (3 балл):\n• Постер немесе сызба құрастыр (3б).\n\nЖеке жұмыс (4 балл):\n• Дербес тапсырманы орында (4б).\n(Жалпы: 10 балл)",
            middleRes: "Электронды оқулық, плакаттар, маркерлер",
            endTeacher: "1. Сабақты бекіту (2 мин): «Сұрақ-жауап» әдісі арқылы негізгі түйінді сұрақтарды пысықтау.\n2. Бағалау (1 мин): Балдарды қорытындылау және мадақтау.\n3. Рефлексия (2 мин): Практикалық жұмыс барысындағы әрекеттерге негізделген сұрақ: Кесте өрістерін баптауда қандай әдіс тиімді болды?\n4. Үй тапсырмасы (1 мин): Үй тапсырмасын түсіндіріп, күнделікке жазғызу.",
            endStudent: "Түйінді сұрақтарға жауап береді. Өз нәтижесін бағалайды. Рефлексия сұрағына пікір білдіреді. Күнделікке жазады.",
            endEval: "Өзара және өзін-өзі бағалау.",
            endRes: "Кері байланыс тақтасы"
          }
        ];

        const selectedVariant = variants[Math.floor(Math.random() * variants.length)];

        resultData = {
          smartGoal: `${formData.topic} мазмұнын меңгеріп, практикалық тапсырмаларды орындау арқылы дағды алады.`,
          values: "«Заң мен тәртіп» аясында сынып ережелері мен техникалық қауіпсіздікті сақтау; «Таза Қазақстан» бағыты бойынша цифрлық ортаның тазалығын қамтамасыз ету.",
          ...selectedVariant
        };
      }

      setGeneratedPlan({ ...formData, ...resultData });
    } catch (err) {
      alert("Қате орын алды: " + err.message);
    } finally {
      setIsGenerating(false);
    }
  };

  const downloadWord = () => {
    const htmlContent = document.getElementById('printable-area').outerHTML;
    const blob = new Blob(['\ufeff' + htmlContent], {
      type: 'application/msword'
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ҚМЖ_${formData.topic}.doc`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  return (
    <div className="max-w-4xl mx-auto bg-white rounded-xl shadow-lg border border-slate-200 p-4 md:p-8">
      <div className="no-print">
        <h1 className="text-2xl font-bold text-center text-indigo-700 mb-2">ҚМЖ Автоматты Генераторы</h1>
        <p className="text-xs text-center text-slate-500 mb-6">Қазақстан Республикасының ресми білім беру стандартына сай (45 мин, 10 балл, ЕББҚ-сыз)</p>

        <form onSubmit={handleGenerate} className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
          <div>
            <label className="block text-xs font-semibold mb-1">Пән:</label>
            <input type="text" name="subject" value={formData.subject} onChange={handleChange} className="w-full p-2 text-sm border border-slate-300 rounded" required />
          </div>

          <div>
            <label className="block text-xs font-semibold mb-1">Педагогтің Т.А.Ә.:</label>
            <input type="text" name="teacherName" value={formData.teacherName} onChange={handleChange} className="w-full p-2 text-sm border border-slate-300 rounded" required />
          </div>

          <div>
            <label className="block text-xs font-semibold mb-1">Күні:</label>
            <input type="text" name="date" value={formData.date} onChange={handleChange} className="w-full p-2 text-sm border border-slate-300 rounded" required />
          </div>

          <div className="grid grid-cols-3 gap-2">
            <div>
              <label className="block text-xs font-semibold mb-1">Сынып:</label>
              <input type="text" name="grade" value={formData.grade} onChange={handleChange} className="w-full p-2 text-sm border border-slate-300 rounded" required />
            </div>
            <div>
              <label className="block text-xs font-semibold mb-1">Қатысқан:</label>
              <input type="number" name="presentCount" value={formData.presentCount} onChange={handleChange} className="w-full p-2 text-sm border border-slate-300 rounded" required />
            </div>
            <div>
              <label className="block text-xs font-semibold mb-1">Қатыспаған:</label>
              <input type="number" name="absentCount" value={formData.absentCount} onChange={handleChange} className="w-full p-2 text-sm border border-slate-300 rounded" required />
            </div>
          </div>

          <div className="md:col-span-2">
            <label className="block text-xs font-semibold mb-1">Бөлім:</label>
            <input type="text" name="unit" value={formData.unit} onChange={handleChange} className="w-full p-2 text-sm border border-slate-300 rounded" required />
          </div>

          <div className="md:col-span-2">
            <label className="block text-xs font-semibold mb-1">Сабақтың тақырыбы:</label>
            <input type="text" name="topic" value={formData.topic} onChange={handleChange} className="w-full p-2 text-sm border border-slate-300 rounded" required />
          </div>

          <div className="md:col-span-2">
            <label className="block text-xs font-semibold mb-1">Оқу мақсаты:</label>
            <textarea name="learningObjective" rows="2" value={formData.learningObjective} onChange={handleChange} className="w-full p-2 text-sm border border-slate-300 rounded" required />
          </div>

          <div className="md:col-span-2">
            <label className="block text-xs font-semibold mb-1">Gemini API Key (Міндетті емес, бос қалдырсаңыз динамикалық режим қолданылады):</label>
            <input type="password" name="apiKey" value={formData.apiKey} onChange={handleChange} placeholder="AIzaSy..." className="w-full p-2 text-sm border border-slate-300 rounded" />
          </div>

          <div className="md:col-span-2">
            <button type="submit" disabled={isGenerating} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded shadow transition">
              {isGenerating ? 'ЖИ арқылы ҚМЖ генерациялануда...' : '✨ Жетілдірілген ҚМЖ Генерациялау'}
            </button>
          </div>
        </form>
      </div>

      {generatedPlan && (
        <div id="printable-area" className="border-2 border-slate-900 p-6 bg-white text-xs text-black">
          <div className="text-right text-[11px] mb-4">
            <div>Тексерілді: __________________</div>
            <div className="font-semibold">Оқу ісі жөніндегі орынбасар</div>
          </div>

          <div className="text-center font-bold text-sm mb-6 tracking-wide">
            ҚЫСҚА МЕРЗІМДІ САБАҚ ЖОСПАРЫ
          </div>

          <table className="w-full border-collapse border border-slate-900 mb-4 text-xs">
            <tbody>
              <tr>
                <td className="border border-slate-900 p-2 font-bold w-1/4">Бөлім:</td>
                <td className="border border-slate-900 p-2">{generatedPlan.unit}</td>
              </tr>
              <tr>
                <td className="border border-slate-900 p-2 font-bold">Педагогтің тегі, аты, әкесінің аты (бар болса):</td>
                <td className="border border-slate-900 p-2">{generatedPlan.teacherName}</td>
              </tr>
              <tr>
                <td className="border border-slate-900 p-2 font-bold">Күні:</td>
                <td className="border border-slate-900 p-2">{generatedPlan.date}</td>
              </tr>
              <tr>
                <td className="border border-slate-900 p-2 font-bold">Сынып: {generatedPlan.grade} «{generatedPlan.section}»</td>
                <td className="border border-slate-900 p-2">
                  Қатысушылардың саны: {generatedPlan.presentCount} &nbsp;&nbsp;|&nbsp;&nbsp; Қатыспағандар саны: {generatedPlan.absentCount}
                </td>
              </tr>
              <tr>
                <td className="border border-slate-900 p-2 font-bold">Сабақтың тақырыбы:</td>
                <td className="border border-slate-900 p-2">{generatedPlan.topic}</td>
              </tr>
              <tr>
                <td className="border border-slate-900 p-2 font-bold">Оқу бағдарламасына сәйкес оқыту мақсаттары:</td>
                <td className="border border-slate-900 p-2">{generatedPlan.learningObjective}</td>
              </tr>
              <tr>
                <td className="border border-slate-900 p-2 font-bold">Сабақтың мақсаты:</td>
                <td className="border border-slate-900 p-2 font-semibold text-indigo-950">{generatedPlan.smartGoal}</td>
              </tr>
              <tr>
                <td className="border border-slate-900 p-2 font-bold">Құндылықтарды дарыту:</td>
                <td className="border border-slate-900 p-2 text-emerald-950">{generatedPlan.values}</td>
              </tr>
            </tbody>
          </table>

          <div className="text-center font-bold bg-slate-200 border border-slate-900 py-1.5 mb-0 tracking-wider">
            САБАҚТЫҢ БАРЫСЫ:
          </div>

          <table className="w-full border-collapse border border-slate-900 text-xs">
            <thead>
              <tr className="bg-slate-100 text-center">
                <th className="border border-slate-900 p-2 w-[16%]">Сабақтың кезеңі / уақыты</th>
                <th className="border border-slate-900 p-2 w-[28%]">Педагогтің әрекеті</th>
                <th className="border border-slate-900 p-2 w-[28%]">Білім алушының әрекеті</th>
                <th className="border border-slate-900 p-2 w-[16%]">Бағалау</th>
                <th className="border border-slate-900 p-2 w-[12%]">Ресурстар</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td className="border border-slate-900 p-2 font-bold text-center">Сабақтың басы<br/>(6 минут)</td>
                <td className="border border-slate-900 p-2 whitespace-pre-line">{generatedPlan.beginningTeacher}</td>
                <td className="border border-slate-900 p-2 whitespace-pre-line">{generatedPlan.beginningStudent}</td>
                <td className="border border-slate-900 p-2 whitespace-pre-line">{generatedPlan.beginningEval}</td>
                <td className="border border-slate-900 p-2 whitespace-pre-line">{generatedPlan.beginningRes}</td>
              </tr>
              <tr>
                <td className="border border-slate-900 p-2 font-bold text-center">Сабақтың ортасы<br/>(33 минут)</td>
                <td className="border border-slate-900 p-2 whitespace-pre-line">{generatedPlan.middleTeacher}</td>
                <td className="border border-slate-900 p-2 whitespace-pre-line">{generatedPlan.middleStudent}</td>
                <td className="border border-slate-900 p-2 whitespace-pre-line">{generatedPlan.middleEval}</td>
                <td className="border border-slate-900 p-2 whitespace-pre-line">{generatedPlan.middleRes}</td>
              </tr>
              <tr>
                <td className="border border-slate-900 p-2 font-bold text-center">Сабақтың соңы<br/>(6 минут)</td>
                <td className="border border-slate-900 p-2 whitespace-pre-line">{generatedPlan.endTeacher}</td>
                <td className="border border-slate-900 p-2 whitespace-pre-line">{generatedPlan.endStudent}</td>
                <td className="border border-slate-900 p-2 whitespace-pre-line">{generatedPlan.endEval}</td>
                <td className="border border-slate-900 p-2 whitespace-pre-line">{generatedPlan.endRes}</td>
              </tr>
            </tbody>
          </table>

          <div className="mt-6 flex justify-end gap-2 no-print">
            <button onClick={downloadWord} className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded shadow">
              📥 Word (.doc) етіп жүктеу
            </button>
            <button onClick={() => window.print()} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded shadow">
              🖨️ Басып шығару (PDF / Print)
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
